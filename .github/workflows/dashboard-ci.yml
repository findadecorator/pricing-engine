name: Dashboard CI

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "plan.md"

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build dashboard
        run: npm run build:dashboard

      - name: Build project
        run: npm run build

      - name: Start server in background
        run: |
          nohup npm run dev > server.log 2>&1 &
          sleep 6

      - name: Run Node smoke tests
        run: |
          node scripts/smoke-dashboard-pro.js
          node scripts/smoke-dashboard-customer.js
          node scripts/smoke-realtime-dashboard.js

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-ci-logs
          path: |
            server.log
            npm-debug.log
